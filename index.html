<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Universal Mobile Mapping GIS — pemetaan lapangan offline-first, layer SHP/KML/GeoTIFF/GeoPDF, cetak peta A4/A3">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; connect-src 'self' https: data: blob:; worker-src 'self' blob:; child-src blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Universal Mobile Mapping GIS</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
:root{--accent:#0f766e;--accent-2:#115e59;--bg:#f3f5f8;--panel:#ffffff;--panel-2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;--info:#2563eb;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);--radius:12px;--top:56px;--side:232px;--bottom:62px;font-synthesis:none}
[data-theme=dark]{--bg:#0b1220;--panel:#111a2b;--panel-2:#0f172a;--text:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;min-height:38px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}.btn.danger.solid{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}.btn[disabled]{opacity:.5;pointer-events:none}
.btn.icon{padding:0;width:40px;min-width:40px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 11px;min-height:40px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}label.f span.req{color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.b-draft{color:#475569}.b-submitted{color:var(--info);border-color:#bfdbfe}.b-approved{color:var(--ok);border-color:#bbf7d0}.b-revision{color:var(--warn);border-color:#fde68a}.b-rejected{color:var(--danger);border-color:#fecaca}.b-pending{color:#c2410c;border-color:#fed7aa}
.svg{width:18px;height:18px;flex:none}
/* ---------- Login ---------- */
#login{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px}
.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:18px}
.login-brand img{width:76px;height:76px;object-fit:contain;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);cursor:zoom-in}
.login-brand h1{margin:0;font-size:20px}.login-brand p{margin:0;color:var(--muted)}
.pw-wrap{position:relative}.pw-wrap .btn{position:absolute;right:4px;top:4px;min-height:32px}
.demo-box{margin-top:14px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--panel));border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line))}
.login-foot{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
/* ---------- Shell ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--top) minmax(0,1fr);grid-template-columns:var(--side) minmax(0,1fr);grid-template-areas:"top top" "side main"}
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.topbar .logo{width:36px;height:36px;border-radius:9px;object-fit:contain;background:var(--panel-2);border:1px solid var(--line);cursor:zoom-in}
.topbar>*{flex-shrink:0}.topbar .ttl{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;flex-shrink:1}.topbar .ttl b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar .ttl small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;background:var(--panel-2);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--danger)}.dot.warn{background:var(--warn)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.sidenav{grid-area:side;background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;border:0;background:none;text-align:left;width:100%}
.nav-i:hover{background:var(--panel-2);color:var(--text)}.nav-i.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.nav-i .cnt{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.side-foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted)}
main{grid-area:main;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow:auto;padding:18px}.tab.map{padding:0;overflow:hidden}
.tab-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tab-h h2{margin:0;font-size:19px}
.bottomnav{display:none}
/* ---------- Map ---------- */
#map{position:absolute;inset:0}
.map-top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:5;pointer-events:none;flex-wrap:wrap}
.map-top>*{pointer-events:auto}
.map-top select{max-width:220px;box-shadow:var(--shadow)}
.tools{position:absolute;right:10px;top:64px;display:flex;flex-direction:column;gap:6px;z-index:5}
.tools .btn{width:44px;height:44px;padding:0;box-shadow:var(--shadow);border-radius:11px}
.tools .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gps-chip{position:absolute;left:10px;bottom:30px;z-index:5;box-shadow:var(--shadow);max-width:calc(100% - 70px)}.gps-chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draw-panel{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 20px);width:560px}
.layer-panel{position:absolute;right:62px;top:64px;z-index:7;width:320px;max-width:calc(100% - 80px);max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.layer-panel h4{margin:12px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.lyr{display:flex;align-items:center;gap:8px;padding:5px 0}.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.maplibregl-ctrl-attrib{font-size:10px}
/* ---------- Lists / tables ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;cursor:pointer}
.item:hover{border-color:var(--accent)}.item .meta{min-width:0;flex:1}.item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gicon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
table.t{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
table.t th{background:var(--panel-2);font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.tscroll{overflow:auto;border-radius:11px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi .card{padding:14px}.kpi b{font-size:24px;display:block}.kpi span{color:var(--muted);font-size:12px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar .lbl{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .trk{flex:1;height:10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}.bar .fill{height:100%;background:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumb{position:relative;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:22px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer;font-weight:600}.seg button.on{background:var(--accent);color:#fff}
.legal h4{margin:16px 0 6px}.legal p,.legal li{color:var(--text);opacity:.9}
.skeleton{background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* ---------- Modal / sheet / toast / zoom ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s ease}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:calc(100% - 20px);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal .mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}.modal .mh b{font-size:16px;flex:1}
.modal .mb{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:20px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;max-width:90vw;animation:fade .15s}
.toast.err{background:var(--danger)}.toast.ok{background:var(--ok)}
.zoomer{position:fixed;inset:0;z-index:90;background:rgba(2,6,23,.92);touch-action:none;overflow:hidden;user-select:none}
.zoomer img{position:absolute;left:50%;top:50%;max-width:92vw;max-height:86vh;transform-origin:center center;will-change:transform;-webkit-user-drag:none}
.zoomer .zbar{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:6px;background:rgba(15,23,42,.8);padding:6px;border-radius:12px}
.zoomer .zbar button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;min-width:42px;height:38px;cursor:pointer;font-weight:700}
.zoomer .zcap{position:absolute;top:14px;left:16px;color:#e2e8f0;font-weight:600}
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}.menu button:hover{background:var(--panel-2)}
.progress{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}.progress>div{height:100%;background:var(--accent);width:0}
/* ---------- Responsif ---------- */
@media (max-width: 860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr) var(--bottom);grid-template-areas:"top" "main" "bottom"}
  .sidenav{display:none}
  .sidenav.open{display:flex;position:fixed;top:var(--top);left:0;bottom:var(--bottom);width:260px;z-index:40;box-shadow:var(--shadow)}
  .bottomnav{grid-area:bottom;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
  .bottomnav button.on{color:var(--accent)}
  .bottomnav .cnt{position:absolute;top:6px;right:calc(50% - 20px);background:var(--warn);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
  .tab{padding:12px}
  .tab-h h2{flex-basis:100%}
  .topbar .ttl small{display:none}
  .hide-m{display:none!important}
  .overlay{align-items:flex-end;padding:0}
  .modal{max-width:100%!important;border-radius:16px 16px 0 0;max-height:92%}
  .draw-panel{bottom:10px}
  .layer-panel{right:10px;left:10px;width:auto;max-width:none;top:60px}
  .map-top select{max-width:46vw}
}
@media (min-width: 861px){.show-m{display:none!important}}
@media (max-width: 520px){#pill-net .lbl{display:none}.topbar{gap:6px;padding:0 8px}.topbar .logo{width:32px;height:32px}.pill{padding:4px 8px}}

</style>
</head>
<body>
<div id="login" class="hidden">
  <div class="login-card">
    <div class="login-brand">
      <img id="lg-logo" alt="Logo" title="Klik untuk memperbesar">
      <div><h1 id="lg-title">Universal Mobile Mapping GIS</h1><p id="lg-sub">Enterprise Field Mapping</p></div>
    </div>
    <form id="lg-form" class="col" autocomplete="on">
      <label class="f">Username<input class="input" id="lg-user" name="username" autocomplete="username" autocapitalize="none" required maxlength="60"></label>
      <label class="f">Password<div class="pw-wrap"><input class="input" id="lg-pass" type="password" name="password" autocomplete="current-password" required maxlength="128"><button type="button" class="btn ghost sm" id="lg-eye" aria-label="Tampilkan password">Lihat</button></div></label>
      <div id="lg-err" class="small" style="color:var(--danger);min-height:18px" role="alert"></div>
      <button class="btn primary" id="lg-btn" type="submit">Masuk</button>
    </form>
    <div id="lg-server" class="hidden" style="margin-top:12px">
      <details><summary class="small muted" style="cursor:pointer">Pengaturan server</summary>
        <div class="col" style="margin-top:8px"><label class="f">URL Web App Apps Script<input class="input mono small" id="lg-api" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <button type="button" class="btn sm" id="lg-api-save">Simpan &amp; uji koneksi</button><div id="lg-api-msg" class="small muted"></div></div>
      </details>
    </div>
    <div id="lg-demo" class="demo-box hidden">
      <b>Mode Demo</b><div class="small muted" style="margin:4px 0 8px">Semua data contoh berlabel [DEMO] dan disimpan hanya di browser ini. Password: <span class="mono">demo1234</span></div>
      <div class="row wrap"><button class="btn sm" data-demo="admin">Admin</button><button class="btn sm" data-demo="supervisor">Supervisor</button><button class="btn sm" data-demo="surveyor">Surveyor</button><button class="btn sm" data-demo="viewer">Viewer</button></div>
    </div>
    <div class="login-foot"><span id="lg-ver"></span> · <a href="#" data-legal="terms">Syarat &amp; Ketentuan</a> · <a href="#" data-legal="privacy">Pemberitahuan Privasi</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <button class="btn icon ghost show-m" id="btn-menu" aria-label="Menu"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <img class="logo" id="hd-logo" alt="Logo" title="Klik untuk memperbesar">
    <div class="ttl grow"><b id="hd-title">Universal Mobile Mapping GIS</b><small id="hd-sub"></small></div>
    <span class="badge b-pending hidden" id="hd-demo" title="Mode demo: data contoh disimpan di browser">DEMO</span>
    <span class="pill" id="pill-net" title="Status koneksi"><span class="dot"></span><span class="lbl">Online</span></span>
    <span class="pill" id="pill-sync" title="Antrean sinkronisasi"><span class="lbl">Tersinkron</span></span>
    <div class="avatar" id="hd-avatar" title="Akun"></div>
  </header>
  <nav class="sidenav" id="sidenav"></nav>
  <main id="main">
    <section class="tab map" data-tab="map">
      <div id="map"></div>
      <div class="map-top">
        <select class="input" id="sel-project" aria-label="Proyek"></select>
        <select class="input" id="sel-layer" aria-label="Layer untuk data baru"></select>
      </div>
      <div class="tools" id="tools">
        <button class="btn" data-tool="Point" title="Rekam titik"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
        <button class="btn" data-tool="LineString" title="Rekam garis"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18l6-8 4 4 6-9"/><circle cx="4" cy="18" r="1.8"/><circle cx="20" cy="5" r="1.8"/></svg></button>
        <button class="btn" data-tool="Polygon" title="Rekam poligon"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7l7-4 7 5-2 10H7z"/></svg></button>
        <button class="btn" data-tool="measure" title="Ukur jarak/luas"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
        <button class="btn" id="btn-gps" title="Posisi GPS / ikuti"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>

  return new Promise(function (res, rej) {
    if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)) return rej(new Error('File harus berupa gambar JPEG/PNG/WebP.'));

      var k = Math.min(1, maxSize / Math.max(w, h)), c = document.createElement('canvas');

    img.src = url;
  });

// ======================================================= Gambar geometri (titik/garis/poligon/ukur)
var Draw = {

  start: function (mode, opt) {

      if (!can('feature.write.own') && !can('feature.write.any')) return toast('Role Anda hanya dapat melihat data.', 'err');
      if (S.license.read_only) return toast(S.license.message || 'Lisensi baca-saja.', 'err');
      var l = layerById(opt.layerId || S.layerId);
      if (!l) return toast('Pilih/buat layer terlebih dahulu (menu Proyek & Layer).', 'err');
      if (l.geom_type !== mode) { var alt = S.layers.find(function (x) { return x.project_id === S.projectId && x.geom_type === mode; }); if (!alt) return toast('Tidak ada layer ' + ({ Point: 'titik', LineString: 'garis', Polygon: 'poligon' }[mode]) + ' di proyek ini.', 'err'); l = alt; S.layerId = l.id; MapView.fillSelectors(); }
      Draw.layer = l;
    }

    Draw.mode = mode; Draw.target = opt.featureId || null; Draw.coords = (opt.coords || []).slice(); Draw.sidePoints = opt.sidePoints || 0;
    Draw._hist = Hist.push(Draw.onBack, 'draw');

    if (MapView.map) MapView.map.getCanvas().style.cursor = 'crosshair';
    Draw.render(); Draw.panel(); Draw.save();
  },
  /** Tombol Back saat merekam: jangan langsung membuang vertex. */
  onBack: async function () {
    Draw._hist = null;
    if (Draw.mode && Draw.mode !== 'measure' && Draw.coords.length) {
      var wasTrack = Draw.trackState();
      if (wasTrack === 'on') Draw.setTrack('paused');
      var ok = await confirmBox('Hentikan rekaman?', Draw.coords.length + ' vertex akan dibuang. Pilih "Lanjut merekam" untuk meneruskan (rekaman tetap tersimpan sebagai draf).', 'Buang rekaman', true);
      if (!ok) { if (Draw.mode) Draw._hist = Hist.push(Draw.onBack, 'draw'); if (wasTrack === 'on') Draw.setTrack('on'); return; }
    }
    Draw.cancel(false, true);
  },
  add: function (p, fromGps) {
    if (!Draw.mode) return;
    if (Draw.mode === 'Point') { Draw.coords = [p]; Draw.render(); Draw.finish(fromGps ? { accuracy: GPS.pos && GPS.pos.acc, altitude: GPS.pos && GPS.pos.alt, timestamp: new Date().toISOString(), source: 'device', samples: 1 } : null); return; }
    Draw.coords.push(p); Draw.render(); Draw.panel(); Draw.save();
  },
  undo: function () { Draw.coords.pop(); Draw.render(); Draw.panel(); Draw.save(); },
  // ---- status rekam jejak: off | on | paused ----
  trackState: function () { return !GPS.track ? 'off' : (GPS.trackPaused ? 'paused' : 'on'); },
  setTrack: function (st) {
    if (st === 'off') { GPS.track = false; GPS.trackPaused = false; }
    else if (st === 'on') { if (!GPS.track) GPS.trackLast = null; GPS.track = true; GPS.trackPaused = false; GPS.start(); if (GPS.pos && GPS.age() <= 10) GPS.trackPoint(); }
    else if (st === 'paused') { GPS.track = true; GPS.trackPaused = true; }
    if (Draw.mode) { Draw.panel(); Draw.save(); }
  },
  pointLayers: function () { return S.layers.filter(function (x) { return x.project_id === (Draw.layer ? Draw.layer.project_id : S.projectId) && x.geom_type === 'Point'; }); },
  /** Ambil titik GPS (fitur titik terpisah) di tengah rekaman garis/poligon tanpa menghentikan rekaman. */
  sidePoint: async function (btn) {
    var pls = Draw.pointLayers(); if (!pls.length) return toast('Proyek ini belum punya layer titik.', 'err');
    var lid = (LS.get('umg_side_layer') && pls.find(function (x) { return x.id === LS.get('umg_side_layer'); })) ? LS.get('umg_side_layer') : pls[0].id;
    var avg = LS.get('umg_side_avg') !== '0', autoPause = LS.get('umg_side_pause') !== '0';
    var before = Draw.trackState();
    if (autoPause && before === 'on') Draw.setTrack('paused');
    var meta;

      if (btn) { btn.disabled = true; btn.textContent = avg ? 'Mengambil sampel 5 dtk…' : 'Membaca GPS…'; }
      if (avg) meta = await GPS.sample(5);
      else {
        if (!GPS.pos || GPS.watch === null) { GPS.start(); throw new Error('Menyalakan GPS… tunggu posisi stabil lalu coba lagi.'); }
        if (GPS.age() > 10) throw new Error('Posisi GPS sudah lama (' + GPS.age() + ' dtk). Tunggu pembaruan.');
        meta = { lon: GPS.pos.lon, lat: GPS.pos.lat, accuracy: GPS.pos.acc, altitude: GPS.pos.alt, samples: 1, timestamp: new Date().toISOString(), source: 'device' };
      }
    } catch (e) { toast(e.message, 'err', 5000); if (autoPause && before === 'on') Draw.setTrack('on'); else Draw.panel(); return; }
    var l = layerById(lid);
    var resume = function (saved) {
      if (saved) { Draw.sidePoints++; toast('Titik tersimpan. Rekaman ' + ({ LineString: 'garis', Polygon: 'poligon' }[Draw.mode] || '') + ' dilanjutkan.', 'ok'); }
      if (Draw.mode && autoPause && before === 'on' && Draw.trackState() === 'paused') Draw.setTrack('on'); else if (Draw.mode) { Draw.panel(); Draw.save(); }
    };
    FeatureForm.open({ id: uuid(), layer_id: l.id, project_id: l.project_id, geometry: { type: 'Point', coordinates: [meta.lon, meta.lat] }, attrs: {}, photos: [], gps: { accuracy: meta.accuracy, altitude: meta.altitude, samples: meta.samples, timestamp: meta.timestamp, source: meta.source }, status: 'draft', version: 0, _new: true },
      { onDone: resume, note: 'Rekaman ' + ({ LineString: 'garis', Polygon: 'poligon' }[Draw.mode]) + ' (' + Draw.coords.length + ' vertex) ' + (Draw.trackState() === 'paused' ? 'dijeda' : 'tetap berjalan') + ' dan tidak hilang.' });
  },
  geometry: function () {
    var c = Draw.coords, m = Draw.mode;

  },
  render: function () {

  /** Draf disimpan setiap perubahan agar rekaman tidak hilang (reload, aplikasi tertutup, baterai habis). */
  save: function () {
    if (!S.user) return;

    LS.set(Draw.key(), JSON.stringify({ mode: Draw.mode, layerId: Draw.layer.id, target: Draw.target, coords: Draw.coords, track: Draw.trackState(), sidePoints: Draw.sidePoints, ts: new Date().toISOString() }));
  },
  restore: async function () {
    var d; try { d = JSON.parse(LS.get(Draw.key()) || 'null'); } catch (e) { d = null; }
    if (!d || !d.coords || !d.coords.length || Draw.mode) return;
    var l = layerById(d.layerId);
    if (!l) { LS.set(Draw.key(), null); return; }
    var ok = await confirmBox('Lanjutkan rekaman?', 'Ada rekaman ' + ({ LineString: 'garis', Polygon: 'poligon' }[d.mode]) + ' "' + l.name + '" yang belum selesai (' + d.coords.length + ' vertex, ' + fmtDate(d.ts) + ').', 'Lanjutkan');
    if (!ok) { if (await confirmBox('Buang rekaman?', 'Rekaman ' + d.coords.length + ' vertex akan dihapus permanen.', 'Buang', true)) LS.set(Draw.key(), null); return; }
    if (l.project_id !== S.projectId) { S.projectId = l.project_id; MapView.refreshData(); }
    Draw.start(d.mode, { layerId: l.id, featureId: d.target, coords: d.coords, sidePoints: d.sidePoints });
    if (d.track !== 'off') Draw.setTrack('paused');

  },
  panel: function () {
    var p = $('#draw-panel');
    if (!Draw.mode) { p.classList.add('hidden'); return; }
    var g = Draw.geometry(), mt = g ? Geo.metrics(g) : {}, m = Draw.mode, ts = Draw.trackState(), rec = m === 'LineString' || m === 'Polygon';
    var name = m === 'measure' ? 'Pengukuran' : ('Rekam ' + ({ Point: 'titik', LineString: 'garis', Polygon: 'poligon' }[m]) + ' → ' + Draw.layer.name);
    var info = mt.area_m2 ? 'Luas ' + fmtNum(mt.area_m2, 1) + ' m² (' + fmtNum(mt.area_ha, 4) + ' ha) · Keliling ' + fmtNum(mt.perimeter_m, 1) + ' m' : (mt.length_m ? 'Panjang ' + fmtNum(mt.length_m, 1) + ' m' : (m === 'Point' ? 'Ketuk peta atau gunakan GPS.' : 'Ketuk peta untuk menambah vertex.'));

      (ts === 'on' ? '<button class="btn sm" data-d="track-pause">⏸ Jeda</button>' : '<button class="btn sm primary" data-d="track-on">▶ Lanjutkan</button>') + '<button class="btn sm" data-d="track-off" title="Hentikan penambahan vertex otomatis (vertex tetap)">■ Stop jejak</button>');
    p.innerHTML = '<div class="row wrap"><b class="grow">' + esc(name) + '</b>' + trackBadge + '<span class="badge">' + Draw.coords.length + ' vertex</span>' + (Draw.sidePoints ? '<span class="badge">' + Draw.sidePoints + ' titik diambil</span>' : '') + '</div><div class="small">' + info + '</div>' +
      (m === 'measure' ? '<div class="seg"><button data-mt="line" class="' + (Draw.measureType !== 'area' ? 'on' : '') + '">Jarak</button><button data-mt="area" class="' + (Draw.measureType === 'area' ? 'on' : '') + '">Luas</button></div>' : '') +
      '<div class="row wrap">' + (m === 'Point' ? '<button class="btn sm primary" data-d="gpsavg">Ambil GPS (rata-rata 5 dtk)</button><button class="btn sm" data-d="gps1">GPS sekarang</button>' : '<button class="btn sm" data-d="undo"' + (Draw.coords.length ? '' : ' disabled') + '>Undo</button><button class="btn sm" data-d="gpsv">+ Vertex GPS</button>' + trackBtns + (m !== 'measure' ? '<button class="btn sm primary" data-d="done">Selesai</button>' : '')) +

        '<label class="row small"><input type="checkbox" id="dp-avg"' + (LS.get('umg_side_avg') !== '0' ? ' checked' : '') + '> rata-rata 5 dtk</label><label class="row small"><input type="checkbox" id="dp-pause"' + (LS.get('umg_side_pause') !== '0' ? ' checked' : '') + '> jeda otomatis</label>'

        else if (a === 'gpsavg') { b.disabled = true; b.textContent = 'Mengambil sampel…'; try { var s = await GPS.sample(5); Draw.coords = [[s.lon, s.lat]]; Draw.render(); Draw.finish(s); } catch (e) { toast(e.message, 'err', 5000); Draw.panel(); } }

// ======================================================= Formulir atribut fitur
var FeatureForm = {
  open: function (f, opts) {
    opts = opts || {}; var done = false;
    var l = layerById(f.layer_id); if (!l) return toast('Layer tidak ditemukan.', 'err');
    var photos = (f.photos || []).slice(), mt = Geo.metrics(f.geometry);
    var fields = (l.schema || []).map(function (fd) {
      var v = (f.attrs || {})[fd.key]; v = v === undefined || v === null ? '' : v;
      var req = fd.required ? ' <span class="req">*</span>' : '', id = 'fa-' + fd.key;
      if (fd.type === 'select') return '<label class="f">' + esc(fd.label) + req + '<select class="input" id="' + id + '"><option value="">— pilih —</option>' + fd.options.map(function (o) { return '<option' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>';
      if (fd.type === 'bool') return '<label class="row" style="font-weight:600"><input type="checkbox" id="' + id + '"' + (v === true ? ' checked' : '') + '> ' + esc(fd.label) + '</label>';
      var t = fd.type === 'number' || fd.type === 'integer' ? 'number' : (fd.type === 'date' ? 'date' : 'text');
      return '<label class="f">' + esc(fd.label) + req + '<input class="input" id="' + id + '" type="' + t + '"' + (fd.type === 'integer' ? ' step="1"' : (fd.type === 'number' ? ' step="any"' : '')) + ' value="' + esc(v) + '" maxlength="5000"></label>';
    }).join('');
    var gpsInfo = f.gps && f.gps.accuracy ? '<span class="badge">GPS ±' + fmtNum(f.gps.accuracy, 1) + ' m · ' + (f.gps.samples || 1) + ' sampel</span>' : '<span class="badge">Digitasi manual</span>';
    var body = document.createElement('div'); body.className = 'col';
    body.innerHTML = '<div class="row wrap small"><span class="badge">' + esc(l.name) + '</span>' + gpsInfo + (mt.area_ha ? '<span class="badge">' + fmtNum(mt.area_ha, 4) + ' ha</span>' : '') + (mt.length_m ? '<span class="badge">' + fmtNum(mt.length_m, 1) + ' m</span>' : '') + (f.geometry.type === 'Point' ? '<span class="badge mono">' + f.geometry.coordinates[1].toFixed(7) + ', ' + f.geometry.coordinates[0].toFixed(7) + '</span>' : '') + '</div>' +
      (fields || '<div class="small muted">Layer ini belum memiliki atribut.</div>') +
      '<div><b class="small">Foto (maks 6)</b><div class="thumbs" id="ff-thumbs" style="margin-top:6px"></div><label class="btn sm" style="margin-top:8px">+ Ambil / pilih foto<input type="file" accept="image/*" capture="environment" multiple hidden id="ff-photo"></label></div>' +
      (f.review_note ? '<div class="card small" style="border-color:var(--warn)"><b>Catatan reviewer:</b> ' + esc(f.review_note) + '</div>' : '');
    function renderThumbs() {
      var box = $('#ff-thumbs', body);
      box.innerHTML = photos.map(function (p, i) { return '<div class="thumb" data-i="' + i + '"><img alt="" data-ref="' + esc(p) + '"><button class="x" data-rm="' + i + '" aria-label="Hapus foto">✕</button></div>'; }).join('') || '<span class="small muted">Belum ada foto.</span>';
      $$('img[data-ref]', box).forEach(function (im) { MediaCache.get(im.getAttribute('data-ref')).then(function (d) { im.src = d; }).catch(function () { im.alt = 'offline'; }); });
      $$('.thumb', box).forEach(function (t) { t.onclick = function (e) { if (e.target.hasAttribute('data-rm')) { photos.splice(+e.target.getAttribute('data-rm'), 1); renderThumbs(); return; } var im = $('img', t); Zoom.open(im.src, 'Foto ' + (+t.getAttribute('data-i') + 1)); }; });
    }

    $('#ff-photo', body).onchange = async function (e) {

      var attrs = {}, errs = [];

    var l = layerById(op.data.layer_id) || {};

  enqueue: async function (op) {

        base_version: chained ? null : (S.serverVer[op.data.id] || (cur && cur.version) || 0), state: 'pending', attempts: 0 };

  schedule: function (ms) { clearTimeout(Sync.timer); Sync.timer = setTimeout(Sync.run, ms || 0); },
  run: async function () {

};

function readLogo(file) {
  return new Promise(function (res, rej) {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return rej(new Error('Logo harus PNG/JPEG/WebP.'));
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { var k = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); var out = c.toDataURL('image/png'); if (out.length > 380000) out = c.toDataURL('image/webp', 0.9); if (out.indexOf('data:image/webp') !== 0 && out.length > 380000) out = c.toDataURL('image/jpeg', 0.85); if (out.length > 380000) return rej(new Error('Logo terlalu kompleks; gunakan gambar yang lebih sederhana.')); res(out); };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Logo tidak dapat dibaca.')); };
    img.src = url;
  });
}

/* gis.js — Navigasi tombol Back (Hist), layer referensi (SHP/KML/KMZ/GeoJSON/GeoTIFF/GeoPDF), dan cetak peta A4/A3.
 * Pustaka berat dimuat sesuai kebutuhan (lazy) dari CDN dan di-cache service worker.
 */
'use strict';

// ======================================================= Tombol Back: kembali ke tampilan sebelumnya
var Hist = {
  stack: [], ignore: 0, lastBack: 0, enabled: false,
  init: function () {
    try { history.replaceState({ umg: 'base' }, ''); history.pushState({ umg: 'guard' }, ''); Hist.enabled = true; }
    catch (e) { Hist.enabled = false; console.warn('History API tidak tersedia', e); return; }
    if (Hist._bound) return;
    Hist._bound = true;
    window.addEventListener('popstate', Hist.onPop);
  },
  /** Daftarkan tampilan yang bisa ditutup dengan tombol Back. close(fromBack) dipanggil saat Back ditekan.
   *  Entri yang sudah ditutup lewat UI ditandai "stale" dan slot riwayatnya dipakai ulang — tanpa history.back()
   *  saat transisi UI (menghindari race pushState/back yang dapat membuat aplikasi keluar). */
  push: function (close, type) {
    var entry = { close: close, type: type || 'overlay' };
    if (!Hist.enabled || !S.user) return entry;
    var top = Hist.stack[Hist.stack.length - 1];
    if (top && top.stale) { Hist.stack[Hist.stack.length - 1] = entry; return entry; }
    Hist.stack.push(entry);
    try { history.pushState({ umg: 'v', n: Hist.stack.length }, ''); } catch (e) { /* abaikan */ }
    return entry;
  },
  release: function (entry) { if (entry && Hist.stack.indexOf(entry) >= 0) entry.stale = true; },
  releaseTabs: function () {
    for (var i = Hist.stack.length - 1; i >= 0 && (Hist.stack[i].type === 'tab' || Hist.stack[i].stale); i--) Hist.stack[i].stale = true;
  },
  reset: function () { Hist.stack = []; },
  onPop: function () {
    if (Hist.ignore > 0) { Hist.ignore--; return; }
    if (!S.user) return;
    var e = Hist.stack.pop();
    if (e && e.stale) { history.back(); return; }   // langkah kosong: lanjutkan mundur ke tampilan sebenarnya
    if (e) { try { e.close(true); } catch (er) { console.warn(er); } return; }
    // Di dasar riwayat: Back pertama kembali ke Peta / peringatan keluar, Back kedua (≤2 dtk) keluar aplikasi.
    if (S.tab !== 'map') { App.show('map', { fromBack: true }); history.pushState({ umg: 'guard' }, ''); return; }
    if (Date.now() - Hist.lastBack < 2000) { Hist.enabled = false; history.back(); return; }
    Hist.lastBack = Date.now();
    toast('Tekan Kembali sekali lagi untuk keluar');
    history.pushState({ umg: 'guard' }, '');
  }
};

      s.onerror = function () { delete Lib._p[name]; rej(new Error('Pustaka ' + name + ' tidak dapat dimuat (periksa koneksi; setelah sekali dimuat akan tersedia offline di versi PWA).')); };

// ======================================================= Sistem koordinat (proj4)
var CRS = {
  /** Definisi proj4 untuk kode EPSG yang lazim di Indonesia. */
  def: function (code) {
    code = Number(code);
    if (!code) return null;
    if (code === 4326 || code === 4755 || code === 9470 || code === 4979) return '+proj=longlat +datum=WGS84 +no_defs';
    if (code === 3857 || code === 900913 || code === 3785 || code === 102100) return '+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +no_defs';
    if (code >= 32601 && code <= 32660) return '+proj=utm +zone=' + (code - 32600) + ' +datum=WGS84 +units=m +no_defs';
    if (code >= 32701 && code <= 32760) return '+proj=utm +zone=' + (code - 32700) + ' +south +datum=WGS84 +units=m +no_defs';
    if (code >= 23830 && code <= 23845) return '+proj=tmerc +lat_0=0 +lon_0=' + (94.5 + 3 * (code - 23830)) + ' +k=0.9999 +x_0=200000 +y_0=1500000 +ellps=WGS84 +towgs84=0,0,0 +units=m +no_defs'; // DGN95 / Indonesia TM-3
    if (code >= 23866 && code <= 23872) return '+proj=utm +zone=' + (code - 23820) + ' +ellps=WGS84 +towgs84=0,0,0 +units=m +no_defs'; // DGN95 UTM N
    if (code >= 23877 && code <= 23884) return '+proj=utm +zone=' + (code - 23830) + ' +south +ellps=WGS84 +towgs84=0,0,0 +units=m +no_defs'; // DGN95 UTM S
    return null;
  },
  isGeographic: function (code) { return [4326, 4755, 9470, 4979].indexOf(Number(code)) >= 0; },
  fromGeoJsonCrs: function (gj) {
    var n = gj && gj.crs && gj.crs.properties && gj.crs.properties.name;
    if (!n) return null;
    if (/CRS84/i.test(n)) return 4326;
    var m = /EPSG:{1,2}(\d+)/i.exec(n);
    return m ? Number(m[1]) : null;
  },
  /** Minta pengguna memasukkan kode EPSG/proj4 bila CRS tidak dikenali. */
  ask: function (hint) {
    return new Promise(function (res) {
      modal({ title: 'Sistem koordinat tidak dikenali', body: '<p class="small">' + esc(hint || '') + '</p><label class="f">Kode EPSG (mis. 32749) atau string proj4<input class="input mono" id="crs-in" placeholder="32749"></label><p class="small muted">Didukung otomatis: WGS84 (4326), Web Mercator (3857), UTM WGS84 (326xx/327xx), DGN95 TM-3 (23830–23845), DGN95 UTM.</p>',
        onClose: function (v) { res(v || null); },
        buttons: [{ label: 'Batal' }, { label: 'Pakai', cls: 'primary', onClick: function (mb) { var v = $('#crs-in', mb).value.trim(); if (!v) throw new Error('Isi kode EPSG atau proj4.'); return /^\d+$/.test(v) ? (CRS.def(v) || (function () { throw new Error('Kode EPSG ' + v + ' belum dikenal; masukkan string proj4.'); })()) : v; } }] });
    });
  },
  reprojectGeoJSON: async function (gj, fromDef) {
    var p4 = await Lib.load('proj4');
    var tr = p4(fromDef, 'EPSG:4326');
    var pt = function (c) { var o = tr.forward([c[0], c[1]]); return c.length > 2 ? [o[0], o[1], c[2]] : [o[0], o[1]]; };
    var walk = function (c, d) { return d === 0 ? pt(c) : c.map(function (x) { return walk(x, d - 1); }); };
    var depth = { Point: 0, MultiPoint: 1, LineString: 1, MultiLineString: 2, Polygon: 2, MultiPolygon: 3 };
    var geom = function (g) { if (!g) return g; if (g.type === 'GeometryCollection') return { type: g.type, geometries: g.geometries.map(geom) }; return { type: g.type, coordinates: walk(g.coordinates, depth[g.type]) }; };
    gj.features.forEach(function (f) { f.geometry = geom(f.geometry); });
    delete gj.crs;
    return gj;
  }
};

function gjBBox(gj) {
  var b = [Infinity, Infinity, -Infinity, -Infinity];
  var add = function (c) { if (typeof c[0] === 'number') { if (c[0] < b[0]) b[0] = c[0]; if (c[1] < b[1]) b[1] = c[1]; if (c[0] > b[2]) b[2] = c[0]; if (c[1] > b[3]) b[3] = c[1]; } else c.forEach(add); };
  var g = function (geo) { if (!geo) return; if (geo.type === 'GeometryCollection') geo.geometries.forEach(g); else if (geo.coordinates) add(geo.coordinates); };
  gj.features.forEach(function (f) { g(f.geometry); });
  return isFinite(b[0]) ? b : null;
}

// ======================================================= Layer referensi (overlay)
var Overlays = {
  list: [], urls: {},
  PALETTE: ['#7c3aed', '#0891b2', '#ea580c', '#db2777', '#65a30d', '#ca8a04', '#2563eb'],
  load: async function () { Overlays.list = (await IDB.all('overlays').catch(function () { return []; })).sort(function (a, b) { return a.order - b.order; }); },
  restoreAll: async function () { if (!Overlays.list.length) await Overlays.load(); Overlays.list.forEach(function (o) { Overlays.addToMap(o); }); },
  ids: function (o) { return ['ov-' + o.id + '-fill', 'ov-' + o.id + '-line', 'ov-' + o.id + '-pt', 'ov-' + o.id + '-ras']; },
  addToMap: function (o) {
    var m = MapView.map; if (!m || !MapView.ready) return;
    var src = 'ov-' + o.id, before = m.getLayer('f-fill') ? 'f-fill' : undefined, vis = o.visible ? 'visible' : 'none';
    Overlays.ids(o).forEach(function (id) { if (m.getLayer(id)) m.removeLayer(id); });
    if (m.getSource(src)) m.removeSource(src);
    if (o.kind === 'vector') {
      m.addSource(src, { type: 'geojson', data: o.geojson });
      m.addLayer({ id: src + '-fill', type: 'fill', source: src, filter: ['in', ['geometry-type'], ['literal', ['Polygon', 'MultiPolygon']]], layout: { visibility: vis }, paint: { 'fill-color': o.color, 'fill-opacity': 0.18 * o.opacity } }, before);
      m.addLayer({ id: src + '-line', type: 'line', source: src, filter: ['in', ['geometry-type'], ['literal', ['LineString', 'MultiLineString', 'Polygon', 'MultiPolygon']]], layout: { visibility: vis }, paint: { 'line-color': o.color, 'line-width': 1.8, 'line-opacity': o.opacity } }, before);
      m.addLayer({ id: src + '-pt', type: 'circle', source: src, filter: ['in', ['geometry-type'], ['literal', ['Point', 'MultiPoint']]], layout: { visibility: vis }, paint: { 'circle-radius': 5, 'circle-color': o.color, 'circle-opacity': o.opacity, 'circle-stroke-width': 1.5, 'circle-stroke-color': '#fff' } }, before);
    } else if (o.kind === 'tiles') {
      var rs = { type: 'raster', tiles: o.tiles, tileSize: o.tileSize || 256, minzoom: o.minzoom || 0, maxzoom: o.maxzoom || 22 };
      if (o.attribution) rs.attribution = esc(o.attribution);
      if (o.bbox) rs.bounds = o.bbox;
      m.addSource(src, rs);
      m.addLayer({ id: src + '-ras', type: 'raster', source: src, layout: { visibility: vis }, paint: { 'raster-opacity': o.opacity } }, before);
    } else {
      if (!Overlays.urls[o.id]) Overlays.urls[o.id] = URL.createObjectURL(o.image);
      m.addSource(src, { type: 'image', url: Overlays.urls[o.id], coordinates: o.corners });
      m.addLayer({ id: src + '-ras', type: 'raster', source: src, layout: { visibility: vis }, paint: { 'raster-opacity': o.opacity, 'raster-fade-duration': 0 } }, before);
    }
  },
  removeFromMap: function (o) {
    var m = MapView.map; if (!m) return;
    Overlays.ids(o).forEach(function (id) { if (m.getLayer(id)) m.removeLayer(id); });
    if (m.getSource('ov-' + o.id)) m.removeSource('ov-' + o.id);
    if (Overlays.urls[o.id]) { URL.revokeObjectURL(Overlays.urls[o.id]); delete Overlays.urls[o.id]; }
  },
  save: async function (o) { await IDB.put('overlays', o); },
  add: async function (o) {
    o.id = o.id || uuid(); o.order = Date.now(); o.visible = true; o.opacity = o.opacity || (o.kind === 'raster' ? 0.9 : 1);
    o.color = o.color || Overlays.PALETTE[Overlays.list.length % Overlays.PALETTE.length]; o.created_at = new Date().toISOString();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    await Overlays.save(o);
    Overlays.list.push(o); Overlays.addToMap(o); Overlays.zoom(o);
    return o;
  },
  remove: async function (o) { Overlays.removeFromMap(o); await IDB.del('overlays', o.id); Overlays.list = Overlays.list.filter(function (x) { return x.id !== o.id; }); },
  setVisible: function (o, v) { o.visible = v; Overlays.save(o); var m = MapView.map; Overlays.ids(o).forEach(function (id) { if (m && m.getLayer(id)) m.setLayoutProperty(id, 'visibility', v ? 'visible' : 'none'); }); },
  setOpacity: function (o, v) {

function lsq(A, b) {

  for (var c = 0; c < 3; c++) {
    var piv = c; for (var r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    var t = M[c]; M[c] = M[piv]; M[piv] = t; var tv = v[c]; v[c] = v[piv]; v[piv] = tv;
    if (Math.abs(M[c][c]) < 1e-15) throw new Error('Titik kontrol georeferensi tidak cukup / segaris.');
    for (var r2 = c + 1; r2 < 3; r2++) { var f = M[r2][c] / M[c][c]; for (var k = c; k < 3; k++) M[r2][k] -= f * M[c][k]; v[r2] -= f * v[c]; }

      var by0 = panel.y + 2.5, bh = panel.h - 5, c1 = pw * 0.44, c2 = pw * 0.29, c3 = pw - c1 - c2 - 6;
      var tH = A3 ? 26 : 19; titleBlock(px0, by0, c1, tH); infoBlock(px0, by0 + tH + 2.5, c1, bh - tH - 2.5);
      if (o.legend) legend(px0 + c1 + 3, by0, c2, bh); else pdf.rect(px0 + c1 + 3, by0, c2, bh);
      var x3 = px0 + c1 + c2 + 6, nH = A3 ? 28 : 21; pdf.rect(x3, by0, c3, nH); north(x3 + (A3 ? 9 : 7), by0 + nH / 2 + 1.5, A3 ? 6 : 4.6); scaleBar(x3 + (A3 ? 19 : 14), by0 + (A3 ? 6 : 4.5), c3 - (A3 ? 21 : 16));
      if (o.inset) insetBlock(x3, by0 + nH + 2.5, c3, bh - nH - 2.5);
    }
    progress('Menyimpan PDF…', 95);
    var proj = S.projects.find(function (p) { return p.id === S.projectId; }) || {};
    var name = ('Peta_' + (proj.name || 'UMG').replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '') + '_' + o.paper + (landscape ? 'L' : 'P') + '_' + new Date().toISOString().slice(0, 10) + '.pdf');

  },
  fmtDeg: function (v, dec, pos, neg) { return fmtNum(Math.abs(v), Math.min(dec + 1, 6)).replace(/\./g, '') + '°' + (v >= 0 ? pos : neg); }
};

// ======================================================= Basemap MapTiler
var MapTiler = {
  STYLES: [['streets-v2', 'Streets', 'png'], ['outdoor-v2', 'Outdoor', 'png'], ['topo-v2', 'Topo', 'png'], ['satellite', 'Satelit', 'jpg'], ['hybrid', 'Hybrid (satelit + label)', 'jpg'], ['basic-v2', 'Basic', 'png'], ['dataviz', 'Dataviz', 'png']],

  ext: function (style) { var s = MapTiler.STYLES.find(function (x) { return x[0] === style; }); return s ? s[2] : 'png'; },

  test: async function (style, key) {

      '<label class="f small" style="margin-top:6px">API key MapTiler' + (org ? ' <span class="muted">(default organisasi tersedia)</span>' : '') + '<input class="input small mono" id="mt-key" autocomplete="off" spellcheck="false" placeholder="' + (org ? 'memakai key organisasi' : 'tempel key dari cloud.maptiler.com') + '" value="' + esc(LS.get('umg_mt_key') || '') + '"></label>' +
      (can('*') ? '<label class="row small" style="margin-top:6px"><input type="checkbox" id="mt-org"> Simpan sebagai key default organisasi</label>' : '') +
      '<div class="row wrap" style="margin-top:6px"><button class="btn sm primary" id="mt-save">Terapkan</button><a class="small" href="https://cloud.maptiler.com/account/keys/" target="_blank" rel="noopener">Dapatkan API key</a></div>' +

      if (!use) return toast('Isi API key MapTiler.', 'err');

      msg.textContent = 'Memeriksa key…';

        LS.set('umg_mt_key', key || null); LS.set('umg_mt_style', style);
        var orgBox = $('#mt-org', box);
        if (orgBox && orgBox.checked && key) { var st = await Api.call('settings.save', { maptiler_key: key }); S.settings = Object.assign(S.settings, st); }
        MapView.restyle(); msg.textContent = 'MapTiler aktif: ' + MapTiler.STYLES.find(function (x) { return x[0] === style; })[1]; toast('Basemap MapTiler diterapkan.', 'ok');
      } catch (e) { msg.textContent = e.message; toast(e.message, 'err', 6000); }

  }
};

// ======================================================= Layer ArcGIS REST (MapServer / ImageServer / FeatureServer)
var ArcGIS = {
  norm: function (u) {
    u = String(u || '').trim().replace(/[?#].*$/, '').replace(/\/+$/, '');
    if (!/^https:\/\//i.test(u) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(u)) throw new Error('URL harus diawali https://');
    var m = /^(.*\/rest\/services\/.+\/(MapServer|ImageServer|FeatureServer))(\/(\d+))?$/i.exec(u);
    if (!m) throw new Error('URL harus berakhiran /MapServer, /ImageServer, /FeatureServer atau /…Server/<id layer>.');
    return { service: m[1], type: m[2].replace(/server$/i, 'Server'), layer: m[4] !== undefined ? Number(m[4]) : null, url: u };
  },
  json: async function (url, token) {
    var r = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'f=json' + (token ? '&token=' + encodeURIComponent(token) : ''), { credentials: 'omit' }).catch(function () { return null; });
    if (!r) throw new Error('Server ArcGIS tidak dapat dihubungi (periksa URL, koneksi, atau CORS).');
    if (!r.ok) throw new Error('Server ArcGIS menjawab HTTP ' + r.status + '.');
    var j = await r.json().catch(function () { throw new Error('Respons ArcGIS bukan JSON.'); });
    if (j.error) throw new Error('ArcGIS: ' + (j.error.message || 'galat') + (j.error.code === 499 || j.error.code === 498 ? ' — layanan butuh token yang valid.' : ''));
    return j;
  },
  extent4326: async function (ext) {
    if (!ext || !isFinite(ext.xmin) || ext.xmin === 'NaN') return null;
    var wkid = ext.spatialReference && (ext.spatialReference.latestWkid || ext.spatialReference.wkid);
    var pts = [[ext.xmin, ext.ymin], [ext.xmax, ext.ymax]];
    if (wkid === 102100 || wkid === 102113) wkid = 3857;
    if (!wkid || CRS.isGeographic(wkid)) return inLonLat([ext.xmin, ext.ymin, ext.xmax, ext.ymax]) ? [ext.xmin, ext.ymin, ext.xmax, ext.ymax] : null;
    var def = CRS.def(wkid); if (!def) return null;
    var p4 = await Lib.load('proj4'), tr = p4(def, 'EPSG:4326');
    var a = tr.forward(pts[0]), b = tr.forward(pts[1]);
    var bb = [Math.max(-180, Math.min(a[0], b[0])), Math.max(-85, Math.min(a[1], b[1])), Math.min(180, Math.max(a[0], b[0])), Math.min(85, Math.max(a[1], b[1]))];
    return inLonLat(bb) ? bb : null;
  },
  /** Periksa layanan; kembalikan info untuk dialog. */
  inspect: async function (url, token) {
    var n = ArcGIS.norm(url), j = await ArcGIS.json(n.url, token);
    var info = { n: n, meta: j, name: j.name || j.mapName || j.serviceDescription || n.service.split('/').slice(-2, -1)[0], layers: [] };
    if (n.layer === null && (n.type === 'MapServer' || n.type === 'FeatureServer')) info.layers = (j.layers || []).filter(function (l) { return !l.subLayerIds || !l.subLayerIds.length; }).map(function (l) { return { id: l.id, name: l.name, geom: l.geometryType || '' }; });
    info.canImage = n.layer === null && (n.type === 'MapServer' || n.type === 'ImageServer');
    info.canVector = n.layer !== null || info.layers.length > 0;
    return info;
  },
  /** Layer gambar online (tile cache bila tersedia, jika tidak: export dinamis per tile). */
  imageLayer: async function (info, token) {
    var j = info.meta, n = info.n, tk = token ? '&token=' + encodeURIComponent(token) : '';
    var ti = j.tileInfo, wkid = ti && ti.spatialReference && (ti.spatialReference.latestWkid || ti.spatialReference.wkid);
    var o = { kind: 'tiles', fmt: 'ArcGIS ' + n.type, name: info.name, attribution: (j.copyrightText || '').replace(/<[^>]*>/g, '').slice(0, 120), source: { url: n.url, token: token || '' } };
    if (j.singleFusedMapCache && ti && (wkid === 3857 || wkid === 102100)) {
      o.tiles = [n.service + '/tile/{z}/{y}/{x}' + (token ? '?token=' + encodeURIComponent(token) : '')];
      o.tileSize = ti.rows || 256;
      var lods = ti.lods || []; o.minzoom = lods.length ? lods[0].level : 0; o.maxzoom = lods.length ? lods[lods.length - 1].level : 19;
      o.meta = { crs: 'EPSG:3857 (tile cache)' };
    } else if (n.type === 'ImageServer') {
      o.tiles = [n.service + '/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=jpgpng&f=image' + tk];
      o.tileSize = 512; o.meta = { crs: 'export dinamis' };
    } else {
      o.tiles = [n.service + '/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&dpi=96&format=png32&transparent=true&f=image' + tk];
      o.tileSize = 512; o.meta = { crs: 'export dinamis' };
    }
    o.bbox = await ArcGIS.extent4326(j.fullExtent || j.extent || j.initialExtent);
    o.opacity = 1;
    return o;
  },
  /** Unduh fitur layer (query, berhalaman) sebagai GeoJSON WGS84 — tersimpan offline. */
  load: async function (layerUrl, token, where) {
    var lj = await ArcGIS.json(layerUrl, token);
    if (lj.type && !/Feature Layer|Table/i.test(lj.type)) throw new Error('Sublayer "' + (lj.name || '') + '" bukan feature layer (tipe: ' + lj.type + ').');
    if (lj.capabilities && lj.capabilities.indexOf('Query') < 0) throw new Error('Layer tidak mengizinkan Query.');
    var page = Math.min(lj.maxRecordCount || 1000, 2000), paging = !!(lj.advancedQueryCapabilities && lj.advancedQueryCapabilities.supportsPagination);
    var feats = [], offset = 0, more = true, LIMIT = 50000, warn = '';
    while (more && feats.length < LIMIT) {
      var qs = 'where=' + encodeURIComponent(where || '1=1') + '&outFields=*&returnGeometry=true&outSR=4326' + (paging ? '&resultOffset=' + offset + '&resultRecordCount=' + page : '') + (token ? '&token=' + encodeURIComponent(token) : '');
      var r = await fetch(layerUrl + '/query?' + qs + '&f=geojson', { credentials: 'omit' }).catch(function () { return null; }), gj = null, j = null;
      if (r && r.ok) { j = await r.json().catch(function () { return null; }); if (j && j.type === 'FeatureCollection') gj = j; }
      if (!gj) { // server lama: f=json (Esri JSON) lalu konversi
        var r2 = await fetch(layerUrl + '/query?' + qs + '&f=json', { credentials: 'omit' }).catch(function () { return null; });
        if (!r2 || !r2.ok) throw new Error('Query layer gagal' + (r2 ? ' (HTTP ' + r2.status + ')' : '') + '.');
        j = await r2.json(); if (j.error) throw new Error('ArcGIS: ' + j.error.message);
        gj = ArcGIS.esriToGeoJSON(j);
      }
      feats = feats.concat(gj.features || []);
      var exceeded = (j && (j.exceededTransferLimit || (j.properties && j.properties.exceededTransferLimit))) || false;
      if (exceeded && !paging) { warn = 'Server membatasi ' + feats.length + ' fitur per permintaan dan tidak mendukung paging — gunakan filter WHERE.'; more = false; }
      else { more = exceeded && (gj.features || []).length > 0; offset += (gj.features || []).length; }
    }
    if (feats.length >= LIMIT) warn = 'Dibatasi ' + LIMIT + ' fitur pertama — gunakan filter WHERE.';
    if (warn) toast(warn, 'err', 7000);
    var rec = await Overlays.vector({ type: 'FeatureCollection', features: feats }, lj.name || 'ArcGIS', 'ArcGIS FeatureLayer', 4326);
    rec.source = { url: layerUrl, token: token || '', where: where || '1=1' };
    rec.attribution = (lj.copyrightText || '').replace(/<[^>]*>/g, '').slice(0, 120);
    if (lj.drawingInfo && lj.drawingInfo.renderer && lj.drawingInfo.renderer.symbol && Array.isArray(lj.drawingInfo.renderer.symbol.color)) {
      var cc = lj.drawingInfo.renderer.symbol.color; var col = lj.drawingInfo.renderer.symbol.outline && lj.drawingInfo.renderer.symbol.type === 'esriSFS' && cc[3] === 0 ? lj.drawingInfo.renderer.symbol.outline.color : cc;
      if (col) rec.color = '#' + col.slice(0, 3).map(function (v) { return ('0' + Number(v).toString(16)).slice(-2); }).join('');
    }
    return rec;
  },
  esriToGeoJSON: function (j) {
    var area = function (r) { var s = 0; for (var i = 0; i < r.length - 1; i++) s += (r[i + 1][0] - r[i][0]) * (r[i + 1][1] + r[i][1]); return s; }; // >0 = searah jarum jam
    var geom = function (g) {
      if (!g) return null;
      if (isFinite(g.x)) return { type: 'Point', coordinates: [g.x, g.y] };
      if (g.points) return { type: 'MultiPoint', coordinates: g.points };
      if (g.paths) return g.paths.length === 1 ? { type: 'LineString', coordinates: g.paths[0] } : { type: 'MultiLineString', coordinates: g.paths };
      if (g.rings) {
        var polys = [];
        g.rings.forEach(function (r) { if (area(r) >= 0 || !polys.length) polys.push([r]); else polys[polys.length - 1].push(r); });
        return polys.length === 1 ? { type: 'Polygon', coordinates: polys[0] } : { type: 'MultiPolygon', coordinates: polys };
      }
      return null;
    };
    return { type: 'FeatureCollection', features: (j.features || []).map(function (f) { return { type: 'Feature', properties: f.attributes || {}, geometry: geom(f.geometry) }; }) };
  },
  dialog: function (onDone) {
    var info = null;
    var md = modal({ title: 'Tambah layer ArcGIS REST', wide: true, body: '<label class="f">URL layanan<input class="input mono small" id="ag-url" placeholder="https://server/arcgis/rest/services/Folder/Nama/MapServer"></label>' +
      '<div class="grid2"><label class="f">Token (opsional, untuk layanan terlindungi)<input class="input mono small" id="ag-token" autocomplete="off"></label><label class="f">Filter WHERE (feature layer)<input class="input mono small" id="ag-where" value="1=1"></label></div>' +
      '<button class="btn sm" id="ag-check" type="button">Periksa layanan</button><div id="ag-info" class="small" style="margin-top:6px"></div>' +
      '<p class="small muted">MapServer/ImageServer ditampilkan sebagai gambar <b>online</b> (tile cache atau export dinamis). Feature layer diunduh sebagai vektor dan <b>tersimpan offline</b>. Server harus mengizinkan CORS. Patuhi ketentuan penggunaan layanan yang Anda tambahkan.</p>',
      buttons: [{ label: 'Batal' }, { label: 'Tambahkan', cls: 'primary', onClick: async function (mb, btn) {
        var token = $('#ag-token', mb).value.trim(), where = $('#ag-where', mb).value.trim() || '1=1';
        if (!info) info = await ArcGIS.inspect($('#ag-url', mb).value, token);
        var mode = (mb.querySelector('input[name=ag-mode]:checked') || {}).value || (info.canImage ? 'image' : 'vector');
        btn.textContent = 'Memuat…';
        var rec;
        if (mode === 'image') rec = await ArcGIS.imageLayer(info, token);
        else {
          var lid = info.n.layer !== null ? info.n.layer : Number(($('#ag-layer', mb) || {}).value);
          if (!isFinite(lid)) throw new Error('Pilih sublayer.');
          rec = await ArcGIS.load(info.n.service + '/' + lid, token, where);
        }
        var o = await Overlays.add(rec);
        toast('Layer "' + o.name + '" ditambahkan' + (o.kind === 'vector' ? ' (' + fmtNum(o.meta.features, 0) + ' fitur).' : '.'), 'ok');
        if (onDone) onDone();
      } }] });
    $('#ag-url', md.body).oninput = function () { info = null; $('#ag-info', md.body).innerHTML = ''; };
    $('#ag-check', md.body).onclick = async function () {
      var box = $('#ag-info', md.body); box.textContent = 'Memeriksa…';
      try {
        info = await ArcGIS.inspect($('#ag-url', md.body).value, $('#ag-token', md.body).value.trim());
        var j = info.meta;
        box.innerHTML = '<div class="card" style="padding:10px"><b>' + esc(info.name) + '</b> · ' + esc(info.n.type) + (info.n.layer !== null ? ' layer ' + info.n.layer : '') + (j.singleFusedMapCache ? ' · tile cache' : '') + (j.currentVersion ? ' · v' + esc(j.currentVersion) : '') +
          (j.copyrightText ? '<div class="muted">' + esc(String(j.copyrightText).replace(/<[^>]*>/g, '')) + '</div>' : '') +
          '<div class="row wrap" style="margin-top:8px">' + (info.canImage ? '<label class="row"><input type="radio" name="ag-mode" value="image" checked> Tampilkan sebagai gambar (online)</label>' : '') +
          (info.canVector ? '<label class="row"><input type="radio" name="ag-mode" value="vector"' + (info.canImage ? '' : ' checked') + '> Unduh fitur (vektor, offline)</label>' : '') + '</div>' +
          (info.layers.length ? '<label class="f" style="margin-top:6px">Sublayer untuk diunduh<select class="input" id="ag-layer">' + info.layers.map(function (l) { return '<option value="' + l.id + '">' + l.id + ' — ' + esc(l.name) + (l.geom ? ' (' + esc(l.geom.replace('esriGeometry', '')) + ')' : '') + '</option>'; }).join('') + '</select></label>' : '') + '</div>';
      } catch (e) { info = null; box.innerHTML = '<span style="color:var(--danger)">' + esc(e.message) + '</span>'; }
    };
  }
};
